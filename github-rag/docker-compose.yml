services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: github-rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: github_rag

    ports:
      - "5432:5432"

    volumes:
      - github_rag_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d github_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  github_rag_data:

